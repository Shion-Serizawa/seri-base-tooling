# ---------------------------------------------------------------------------
# サプライチェーン対策
# ---------------------------------------------------------------------------
[install]
# 1) バージョンレンジを禁止し、常に完全固定（^ / ~ を書かせない）
exact = true

# 2) 公開直後のパッケージを拒否する「遅延」。単位は秒。
#    7 日 = 604800。汚染されたリリースが取り下げ／検知されるまでの待機時間を稼ぐ。
#    緊急のセキュリティ修正を取り込む場合のみ:
#      bun add <pkg> --minimum-release-age=0
minimumReleaseAge = 604800

# 3) tarball の integrity 検証を必ず行う（--no-verify を使わない）
#    ※ Bun はデフォルトで依存パッケージの postinstall を一切実行しない。
#      実行が必要な場合のみ package.json の trustedDependencies に明示追加する。
#      現在の許可リスト: なし（`bun pm untrusted` でブロック済みスクリプトを確認できる）

[install.cache]
# CI ではキャッシュを信頼せず lockfile から復元する
disable = false
